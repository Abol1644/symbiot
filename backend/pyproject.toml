[project]
name = "symbiot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-ollama",
    "langsmith",
    "pydantic-settings",
    "docker",
    "fastapi",
    "httpx",
    "cryptography>=42",
    "keyring>=25",
    "uvicorn",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite",
]

[dependency-groups]
dev = ["langgraph-cli[inmem]", "pytest", "ruff>=0.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.pytest.ini_options]
markers = ["real_provider: end-to-end test against a real API provider (gated by SYMBIOT_REAL_PROVIDER_TEST=1)"]
